name: Alerta de Obras Paradas

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 9h Brasilia (12h UTC), segunda a sexta
  workflow_dispatch:

jobs:
  check-obras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Verificar obras e enviar alertas via Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, os, sys
          from datetime import datetime, timezone

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          token = os.environ.get("TELEGRAM_TOKEN","").strip()
          config     = data.get("config", {})
          alert_days = int(config.get("alertDays", 1))
          alert_secs = alert_days * 86400
          now     = datetime.now(timezone.utc)
          columns = data.get("columns", [])
          col_map = {c["id"]: c["name"] for c in columns}

          SKIP_COLS = set()
          for c in columns:
              if "entregue" in c["name"].lower():
                  SKIP_COLS.add(c["id"])

          users = data.get("users", [])
          cards = data.get("cards", [])

          def seconds_since(iso):
              try:
                  dt = datetime.fromisoformat(iso.replace("Z","+00:00"))
                  return (now - dt).total_seconds()
              except:
                  return 0

          def elapsed(secs):
              if secs < 3600: return f"{int(secs//60)}min"
              if secs < 86400: return f"{secs/3600:.1f}h"
              return f"{int(secs//86400)}d"

          def fmt(iso):
              try:
                  from datetime import timedelta
                  dt = datetime.fromisoformat(iso.replace("Z","+00:00"))
                  dt_br = dt - timedelta(hours=3)
                  return dt_br.strftime("%d/%m/%Y %H:%M") + " (Brasilia)"
              except:
                  return iso

          overdue = []
          for card in cards:
              if card.get("colId","") in SKIP_COLS:
                  continue
              upd = card.get("updatedAt", card.get("createdAt",""))
              if upd and seconds_since(upd) >= alert_secs:
                  overdue.append({
                      "name":    card.get("name","(sem nome)"),
                      "col":     col_map.get(card.get("colId",""),"--"),
                      "resp":    card.get("resp","--"),
                      "addr":    card.get("addr","--"),
                      "elapsed": elapsed(seconds_since(upd)),
                      "upd":     fmt(upd),
                  })

          if not overdue:
              print(f"Nenhuma obra parada (limite: {alert_days}d). Nenhuma mensagem enviada.")
              sys.exit(0)

          print(f"{len(overdue)} obra(s) parada(s) ha mais de {alert_days}d.")
          lines = ["Kanban de Obras - Alerta", f"({len(overdue)} obra(s) sem atualizacao ha mais de {alert_days} dia(s))", ""]
          for o in overdue:
              lines += [
                  f"Obra: {o['name']}",
                  f"Coluna: {o['col']}",
                  f"Responsavel: {o['resp']}",
                  f"Endereco: {o['addr']}",
                  f"Ultima atualizacao: {o['upd']} ({o['elapsed']} atras)",
                  ""
              ]
          lines.append("Acesse o Kanban e atualize!")
          msg = "\n".join(lines)

          recipients = [u for u in users if u.get("telegramChatId")]
          if not recipients:
              print("Nenhum usuario com Telegram Chat ID.")
              sys.exit(0)

          def send_tg(chat_id, text):
              url     = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = json.dumps({"chat_id": str(chat_id), "text": text}).encode()
              req     = urllib.request.Request(url, data=payload, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode())

          for user in recipients:
              try:
                  send_tg(user["telegramChatId"], msg)
                  print(f"Enviado para {user.get('name','?')}")
              except Exception as e:
                  print(f"Erro para {user.get('name','?')}: {e}")
          PYEOF
